sources:
  - name: jshop
    database: raw
    schema: jshop
    tables:
      - name: customers
        columns:
        - name: id
          data_tests:
            - unique
            - not_null
      - name: orders
        columns:
          - name: id
            data_tests:
              - unique
              - not_null
        config:
          freshness:
            warn_after:
              count: 12
              period: hour
            error_after:
              count: 20
              period: day
          loaded_at_field: _ETL_LOADED_AT