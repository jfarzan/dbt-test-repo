models:
  - name: stg_jshop__customers
    columns:
    - name: customer_id
      data_tests:
        - unique
        - not_null

  - name: stg_jshop__orders
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null
      - name: customer_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_jshop__customers')
                field: customer_id
      - name: order_status
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - completed
                  - shipped
                  # - returned
                  - placed
                  - return_pending

          
          
      
    
      